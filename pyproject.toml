[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-analysis-toolkit"
version = "0.1.0"
description = "University image processing toolkit with an image viewer and a cell counter."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "PySide6>=6.8",
    "matplotlib>=3.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

